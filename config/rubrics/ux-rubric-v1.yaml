  - id: PERF-STABILITY-LAYOUT-SHIFT
    category_id: performance_stability
    title: "Visual stability and no disruptive layout shifts"
    authority: "Web Performance & UX Best Practices"
    default_severity: minor
    allowed_severities: [minor, major]
    scope: state
    scoring_eligible: true
