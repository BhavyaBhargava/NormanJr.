schema_version: "1.0"
rubric_id: "normanjr-ux"
rubric_version: "1.1.0"

categories:
  - id: task_completion
    label: "Task Flow"
    weight: 0.22
  - id: accessibility_operability
    label: "Accessibility"
    weight: 0.18
  - id: feedback_status
    label: "Status & Feedback"
    weight: 0.12
  - id: constraints_error_recovery
    label: "Error Recovery"
    weight: 0.12
  - id: discoverability_affordance
    label: "Affordance & Signs"
    weight: 0.10
  - id: mapping_conceptual_model
    label: "Mapping"
    weight: 0.05
