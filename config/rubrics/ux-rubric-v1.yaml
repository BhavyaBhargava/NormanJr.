  critical: 15
  major: 8
  minor: 3
  observation: 0

criteria:
  - id: WCAG-2.5.8-TARGET-SIZE
    category_id: accessibility_operability
    title: "Target size (minimum)"
    authority: "WCAG 2.2 SC 2.5.8"
    default_severity: major
    allowed_severities: [minor, major]
    scope: component
    scoring_eligible: true

  - id: WCAG-1.4.3-CONTRAST
    category_id: accessibility_operability
    title: "Contrast (minimum)"
    authority: "WCAG 2.2 SC 1.4.3"
    default_severity: major
    allowed_severities: [minor, major]
    scope: component
    scoring_eligible: true

  - id: WCAG-4.1.2-NAME-ROLE-VALUE
    category_id: accessibility_operability
    title: "Name, role, value"
    authority: "WCAG 2.2 SC 4.1.2"
    default_severity: critical
    allowed_severities: [major, critical]
    scope: component
    scoring_eligible: true

  - id: WCAG-2.1.1-KEYBOARD
    category_id: accessibility_operability
    title: "Keyboard accessible"
    authority: "WCAG 2.2 SC 2.1.1"
